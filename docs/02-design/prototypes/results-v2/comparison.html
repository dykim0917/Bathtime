<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>바스타임 온천 결과 V2 시안</title>
  <link rel="icon" href="data:," />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --canvas: #eef1ed;
      --surface: #ffffff;
      --ink: #182522;
      --body: #44504c;
      --muted: #6e7874;
      --primary: #176b63;
      --border: #d7ded9;
      --shadow: 0 18px 48px rgba(24, 37, 34, 0.16);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: Pretendard, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, a { font: inherit; }
    button { cursor: pointer; }
    .toolbar { position: fixed; inset: 0 0 auto; z-index: 10; display: grid; grid-template-columns: minmax(220px, 1fr) auto; align-items: center; gap: 20px; height: 72px; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 24px; }
    .title { display: grid; gap: 2px; }
    .title strong { font-size: 16px; }
    .title span { color: var(--muted); font-size: 12px; }
    .toolbar-actions { display: flex; align-items: center; gap: 12px; }
    .viewports { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--canvas); }
    .viewports button, .open-page { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; border: 0; border-radius: 4px; background: transparent; color: var(--body); font-size: 13px; font-weight: 700; }
    .viewports button { width: 40px; padding: 0; }
    .viewports button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(24, 37, 34, 0.12); }
    .open-page { gap: 8px; border: 1px solid var(--border); padding: 0 14px; text-decoration: none; }
    .frame-stage { position: fixed; inset: 72px 0 0; display: grid; place-items: start center; overflow: auto; padding: 20px; }
    .frame-shell { width: min(1280px, 100%); height: calc(100vh - 112px); overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
    .frame-shell[data-size="tablet"] { width: min(768px, 100%); }
    .frame-shell[data-size="mobile"] { width: min(390px, 100%); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--surface); }

    @media (max-width: 680px) {
      .toolbar { grid-template-columns: 1fr auto; height: 112px; padding: 10px 12px; }
      .title { grid-column: 1 / 3; }
      .open-page span { display: none; }
      .frame-stage { inset-block-start: 112px; padding: 8px; }
      .frame-shell { height: calc(100vh - 128px); }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="title"><strong>바스타임 온천 결과 V2</strong><span>Evidence Workbench · 후보를 빠르게 좁히는 비교 화면</span></div>
    <div class="toolbar-actions">
      <div class="viewports" role="group" aria-label="화면 크기 선택">
        <button type="button" data-size="desktop" aria-pressed="true" title="데스크톱"><i class="ph ph-desktop" aria-hidden="true"></i></button>
        <button type="button" data-size="tablet" aria-pressed="false" title="태블릿"><i class="ph ph-device-tablet" aria-hidden="true"></i></button>
        <button type="button" data-size="mobile" aria-pressed="false" title="모바일"><i class="ph ph-device-mobile" aria-hidden="true"></i></button>
      </div>
      <a class="open-page" href="./index.html" target="_blank" rel="noreferrer"><i class="ph ph-arrow-square-out" aria-hidden="true"></i><span>새 창</span></a>
    </div>
  </header>
  <main class="frame-stage">
    <div class="frame-shell" id="frame-shell" data-size="desktop">
      <iframe src="./index.html" title="바스타임 온천 결과 V2 시안"></iframe>
    </div>
  </main>
  <script>
    const shell = document.querySelector('#frame-shell');
    document.querySelectorAll('[data-size]').forEach((button) => {
      button.addEventListener('click', () => {
        shell.dataset.size = button.dataset.size;
        document.querySelectorAll('[data-size]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      });
    });
  </script>
</body>
</html>
