<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>바스타임 메인 V2 시안 비교</title>
  <link rel="icon" href="data:," />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --canvas: #eef1ed;
      --surface: #ffffff;
      --ink: #182522;
      --body: #44504c;
      --muted: #6e7874;
      --primary: #176b63;
      --primary-soft: #ddebe7;
      --border: #d7ded9;
      --shadow: 0 18px 48px rgba(24, 37, 34, 0.16);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: Pretendard, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, a { font: inherit; }
    button { cursor: pointer; }
    .toolbar { position: fixed; inset: 0 0 auto; z-index: 10; display: grid; grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr); align-items: center; gap: 20px; height: 72px; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 24px; }
    .title { display: grid; gap: 2px; }
    .title strong { font-size: 16px; }
    .title span { color: var(--muted); font-size: 12px; }
    .segmented, .viewports { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--canvas); }
    .segmented button, .viewports button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; border: 0; border-radius: 4px; background: transparent; color: var(--body); padding: 0 14px; font-size: 13px; font-weight: 700; }
    .segmented button[aria-pressed="true"], .viewports button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(24, 37, 34, 0.12); }
    .viewports { justify-self: end; }
    .viewports button { width: 40px; padding: 0; }
    .frame-stage { position: fixed; inset: 72px 0 0; display: grid; place-items: start center; overflow: auto; padding: 20px; }
    .frame-shell { width: min(1280px, 100%); height: calc(100vh - 112px); overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
    .frame-shell[data-size="tablet"] { width: min(768px, 100%); }
    .frame-shell[data-size="mobile"] { width: min(390px, 100%); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--surface); }
    @media (max-width: 760px) {
      .toolbar { grid-template-columns: 1fr auto; height: 120px; padding: 10px 12px; }
      .title { grid-column: 1 / 3; }
      .segmented button span { display: none; }
      .viewports { justify-self: end; }
      .frame-stage { inset-block-start: 120px; padding: 8px; }
      .frame-shell { height: calc(100vh - 136px); }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="title"><strong>바스타임 메인 V2</strong><span id="direction-note">A · Desire Atlas · 목욕하는 순간 중심</span></div>
    <div class="segmented" role="group" aria-label="디자인 방향 선택">
      <button type="button" data-direction="a" aria-pressed="true"><strong>A</strong><span>Desire Atlas</span></button>
      <button type="button" data-direction="b" aria-pressed="false"><strong>B</strong><span>Evidence Index</span></button>
    </div>
    <div class="viewports" role="group" aria-label="화면 크기 선택">
      <button type="button" data-size="desktop" aria-pressed="true" title="데스크톱"><i class="ph ph-desktop"></i></button>
      <button type="button" data-size="tablet" aria-pressed="false" title="태블릿"><i class="ph ph-device-tablet"></i></button>
      <button type="button" data-size="mobile" aria-pressed="false" title="모바일"><i class="ph ph-device-mobile"></i></button>
    </div>
  </header>
  <main class="frame-stage">
    <div class="frame-shell" id="frame-shell" data-size="desktop">
      <iframe id="prototype-frame" src="./a-photo-atlas.html" title="바스타임 메인 V2 시안 A"></iframe>
    </div>
  </main>
  <script>
    const directions = {
      a: { src: './a-photo-atlas.html', title: '바스타임 메인 V2 시안 A', note: 'A · Desire Atlas · 목욕하는 순간 중심' },
      b: { src: './b-evidence-index.html', title: '바스타임 메인 V2 시안 B', note: 'B · Evidence Index · 조건과 판정 중심' },
    };
    const frame = document.querySelector('#prototype-frame');
    const shell = document.querySelector('#frame-shell');
    const note = document.querySelector('#direction-note');

    document.querySelectorAll('[data-direction]').forEach((button) => {
      button.addEventListener('click', () => {
        const next = directions[button.dataset.direction];
        frame.src = next.src;
        frame.title = next.title;
        note.textContent = next.note;
        document.querySelectorAll('[data-direction]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      });
    });

    document.querySelectorAll('[data-size]').forEach((button) => {
      button.addEventListener('click', () => {
        shell.dataset.size = button.dataset.size;
        document.querySelectorAll('[data-size]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      });
    });
  </script>
</body>
</html>
