plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bathtimepocket'
version = '1.0.0'

android {
  namespace 'expo.modules.bathtimepocket'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.work:work-runtime:2.10.1'
}
