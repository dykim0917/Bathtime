version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      root-security-surface:
        patterns:
          - "@supabase/*"
          - "expo*"
          - "react-native*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      web-security-surface:
        patterns:
          - "next"
          - "@supabase/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      admin-security-surface:
        patterns:
          - "next"
          - "@supabase/*"
        update-types:
          - minor
          - patch
